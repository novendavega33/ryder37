<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-color-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-color-opacity="0.8" />
    </linearGradient>
  </defs>
  <!-- Background hex base -->
  <rect width="64" height="64" rx="14" fill="#080c14" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="url(#grad1)" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Network Topology Lines -->
  <line x1="32" y1="18" x2="18" y2="40" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="3 2" />
  <line x1="32" y1="18" x2="46" y2="40" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7" stroke-dasharray="3 2" />
  <line x1="18" y1="40" x2="46" y2="40" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7" />
  <line x1="32" y1="18" x2="32" y2="48" stroke="#60a5fa" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Core Router / Central Node -->
  <circle cx="32" cy="18" r="7" fill="#0b1329" stroke="#38bdf8" stroke-width="2.5" />
  <circle cx="32" cy="18" r="3" fill="#38bdf8" />
  
  <!-- Left Node -->
  <circle cx="18" cy="40" r="5.5" fill="#0b1329" stroke="#0ea5e9" stroke-width="2" />
  <circle cx="18" cy="40" r="2.5" fill="#0ea5e9" />

  <!-- Right Node -->
  <circle cx="46" cy="40" r="5.5" fill="#0b1329" stroke="#0ea5e9" stroke-width="2" />
  <circle cx="46" cy="40" r="2.5" fill="#0ea5e9" />

  <!-- Gateway / Bottom Node -->
  <circle cx="32" cy="48" r="4.5" fill="#0b1329" stroke="#6366f1" stroke-width="2" />
  <circle cx="32" cy="48" r="2" fill="#6366f1" />
</svg>
